name: Release (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version name (e.g. v0.5.0)'
        required: false
        default: 'manual'

# 최소 권한 원칙 (Least Privilege)
permissions:
  contents: write

jobs:
  # 1. [CI 단계] 선행 빌드 무결성 검증 (Quality Gate)
  pre-release-check:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 환경변수 파일 준비 (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Vite 프로덕션 번들링 무결성 검증
        run: npm run build

  # 2. [CD 단계] 3대 OS 병렬 패키징
  build-and-package:
    name: Package (${{ matrix.os }})
    needs: pre-release-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      # macOS 빌드 시 불필요한 키체인 인증서 검색 경고 방지
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "[Linux] AppImage 의존 패키지 설치"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: 의존성 설치
        run: npm ci

      - name: 환경변수 파일 준비 (.env)
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: "[Windows] 패키징 (.exe, portable)"
        if: runner.os == 'Windows'
        run: npm run package:win

      - name: "[macOS] 패키징 (.dmg)"
        if: runner.os == 'macOS'
        run: npm run package:mac

      - name: "[Linux] 패키징 (.AppImage, .deb)"
        if: runner.os == 'Linux'
        run: npm run package:linux

      - name: 빌드 산출물 아티팩트 임시 업로드
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.zip
            dist-electron/latest*.yml
          if-no-files-found: warn

  # 3. [Release 단계] GitHub Releases 통합 배포 (제목, 본문 템플릿 포함)
  publish-release:
    name: Publish to GitHub Releases
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 빌드 산출물 다운로드
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 릴리즈 메타데이터(제목 및 본문) 생성
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          TARGET_TAG="${TAG_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            TARGET_TAG="${INPUT_VERSION}"
          fi

          RELEASE_TITLE="MyDiary Desktop ${TARGET_TAG}"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV

          TAG_MSG=$(git tag -l --format='%(contents)' "$TARGET_TAG" 2>/dev/null | sed '/^$/d')
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(git log -1 --pretty=%B)
          fi

          {
            echo "## 🚀 MyDiary Desktop 릴리즈 안내"
            echo ""
            echo "교사와 학생을 위한 성장 기록 및 주간 일지 관리 데스크톱 애플리케이션입니다."
            echo ""
            echo "### 📦 OS별 다운로드 및 설치 안내"
            echo "| 운영체제 (OS) | 설치 파일 | 설명 |"
            echo "| :--- | :--- | :--- |"
            echo "| 🪟 **Windows** | \`MyDiary Setup *.exe\`<br>\`MyDiary *.exe\` (Portable) | Windows 10/11 설치형 프로그램 및 무설치 포터블 |"
            echo "| 🍎 **macOS** | \`MyDiary-*.dmg\` | Intel 및 Apple Silicon (M1/M2/M3/M4) 통합 지원 |"
            echo "| 🐧 **Linux** | \`MyDiary-*.AppImage\`<br>\`*.deb\` | Ubuntu / Debian 및 AppImage 호환 배포판 |"
            echo ""
            echo "---"
            echo ""
            echo "### 📋 주요 변경 사항 (Changelog)"
            echo ""
            echo "${TAG_MSG}"
            echo ""
            echo "---"
          } > release_body.md

      - name: GitHub Release 배포 및 파일 첨부
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_body.md
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.zip
            release-artifacts/latest*.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
